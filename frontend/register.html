<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a08">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Noto+Sans:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/scene.css">
  <title>Irminsul</title>
</head>
<body class="scene">
  <header id="app-header"></header>
  <div class="auth">
  <svg class="scene-art" id="scene-art" aria-hidden="true"></svg>
  <main id="app-main" class="glass auth-card stack">
    <h1 data-i18n="register.title"></h1>
    <div id="form-error" class="alert alert--error" role="alert" hidden></div>
    <form id="register-form" class="stack" novalidate>
      <fieldset class="field">
        <legend data-i18n="register.role"></legend>
        <div class="choice-list">
          <label class="choice"><input type="radio" name="role" value="farmer" checked>
            <span><strong data-i18n="roles.farmer"></strong><br><span class="hint" data-i18n="register.role_farmer_desc"></span></span></label>
          <label class="choice"><input type="radio" name="role" value="distributor">
            <span><strong data-i18n="roles.distributor"></strong><br><span class="hint" data-i18n="register.role_distributor_desc"></span></span></label>
          <label class="choice"><input type="radio" name="role" value="storage_operator">
            <span><strong data-i18n="roles.storage_operator"></strong><br><span class="hint" data-i18n="register.role_storage_desc"></span></span></label>
        </div>
      </fieldset>
      <div class="field">
        <label for="name" data-i18n="register.name"></label>
        <input class="input" id="name" name="name" autocomplete="name" maxlength="80" required>
      </div>
      <div class="field">
        <label for="email" data-i18n="register.email"></label>
        <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="email-hint">
        <span class="hint" id="email-hint" data-i18n="register.email_hint"></span>
      </div>
      <div class="field">
        <label for="password" data-i18n="register.password"></label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="pw-hint">
        <span class="hint" id="pw-hint" data-i18n="register.password_hint"></span>
      </div>
      <div class="field" id="org-field" hidden>
        <label for="org_name" id="org-label"></label>
        <input class="input" id="org_name" name="org_name" maxlength="120">
        <span class="hint" data-i18n="register.pending_note"></span>
      </div>
      <button class="btn btn--primary btn--block" type="submit" data-i18n="register.submit"></button>
    </form>
    <p class="muted"><span data-i18n="register.have_account"></span> <a href="/login.html" data-i18n="register.login_link"></a></p>
  </main>
  </div>
  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
