<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a08">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Noto+Sans:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/scene.css">
  <title>Irminsul</title>
</head>
<body class="scene">
  <header id="app-header"></header>
  <div class="auth">
  <svg class="scene-art" id="scene-art" aria-hidden="true"></svg>
  <main id="app-main" class="glass auth-card stack">
    <h1 data-i18n="login.title"></h1>
    <div id="form-error" class="alert alert--error" role="alert" hidden></div>
    <form id="login-form" class="stack" novalidate>
      <div class="field">
        <label for="email" data-i18n="login.email"></label>
        <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password"></label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" data-i18n="login.submit"></button>
    </form>
    <p class="muted"><span data-i18n="login.no_account"></span> <a href="/register.html" data-i18n="login.register_link"></a></p>
  </main>
  </div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
