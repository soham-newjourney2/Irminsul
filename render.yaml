# Render Blueprint (https://render.com/docs/blueprint-spec). One free web service:
# API + static frontend + WebSocket. Secrets are NOT in this file:
# `sync: false` values are entered in the Render dashboard when the Blueprint is created.
services:
  - type: web
    runtime: python
    name: irminsul
    plan: free
    region: singapore # closest Render region to West Bengal
    # Python is pinned by .python-version (3.12); uv is used because uv.lock is present.
    buildCommand: uv sync --frozen --no-dev && uv run --no-sync python -I scripts/model/download.py
    # Render terminates TLS at its proxy; uvicorn trusts its X-Forwarded-For (FORWARDED_ALLOW_IPS
    # below) so per-IP login limits see the real client IP (security review finding #5).
    startCommand: uv run --no-sync uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: UV_VERSION
        value: 0.13.5
      - key: FORWARDED_ALLOW_IPS
        value: "*" # only Render's proxy can reach the service
      - key: ENVIRONMENT
        value: production # Secure cookies + HSTS
      - key: MONGODB_DB
        value: irminsul_prod # separate from the local dev database
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://irminsul.onrender.com — used in QR codes
