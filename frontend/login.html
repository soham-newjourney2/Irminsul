<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <title>Irminsul</title>
</head>
<body>
  <header id="app-header"></header>
  <main id="app-main" class="container narrow stack">
    <h1 data-i18n="login.title"></h1>
    <div id="form-error" class="alert alert--error" role="alert" hidden></div>
    <form id="login-form" class="stack" novalidate>
      <div class="field">
        <label for="phone" data-i18n="login.phone"></label>
        <input class="input" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password"></label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" data-i18n="login.submit"></button>
    </form>
    <p class="muted"><span data-i18n="login.no_account"></span> <a href="/register.html" data-i18n="login.register_link"></a></p>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
